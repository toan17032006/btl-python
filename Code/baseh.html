<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tra cứu Cầu thủ - PTIT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .search-container { margin-top: 50px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 search-container">
            <h2 class="text-center mb-4 text-danger">⚽ TRA CỨU CẦU THỦ ⚽</h2>
            
            <form action="/search" method="GET" class="row g-3">
                <div class="col-md-5">
                    <input type="text" name="name" class="form-control" placeholder="Tên cầu thủ (vd: Messi)">
                </div>
                <div class="col-md-5">
                    <input type="text" name="club" class="form-control" placeholder="Câu lạc bộ (vd: Boca Juniors)">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-danger w-100">Tìm</button>
                </div>
            </form>

            <hr class="my-4">

            <div class="table-responsive">
                <table class="table table-hover table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>Tên cầu thủ</th>
                            <th>Câu lạc bộ</th>
                            <th>Số bàn thắng</th>
                            <th>Quốc tịch</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for player in players %}
                        <tr>
                            <td>{{ player.name }}</td>
                            <td>{{ player.club }}</td>
                            <td>{{ player.goals }}</td>
                            <td>{{ player.nationality }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% if not players %}
                    <p class="text-center text-muted">Nhập thông tin để tìm kiếm dữ liệu từ cauthuanh.db</p>
                {% endif %}
            </div>
        </div>
    </div>
</div>

</body>
</html>
